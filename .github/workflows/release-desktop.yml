name: Release Desktop Builds

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-version:
    name: Verify version consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check tag matches package.json / Cargo.toml / tauri.conf.json
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(jq -r .version package.json)
          TAURI=$(jq -r .version src-tauri/tauri.conf.json)
          CARGO=$(awk -F\" '/^version[[:space:]]*=/ {print $2; exit}' src-tauri/Cargo.toml)
          echo "tag=$TAG package.json=$PKG tauri.conf.json=$TAURI Cargo.toml=$CARGO"
          if [ "$TAG" != "$PKG" ] || [ "$TAG" != "$TAURI" ] || [ "$TAG" != "$CARGO" ]; then
            echo "::error::Version mismatch — tag '$TAG' must equal package.json ($PKG), tauri.conf.json ($TAURI), and Cargo.toml ($CARGO)"
            exit 1
          fi

  build:
    name: Build ${{ matrix.name }}
    needs: verify-version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86_64
            artifact_name: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundle_args: --bundles nsis,msi
          - name: Windows ARM64
            artifact_name: windows-arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            bundle_args: --bundles nsis,msi
          - name: macOS x86_64
            artifact_name: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            bundle_args: --bundles dmg
          - name: macOS ARM64
            artifact_name: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            bundle_args: --bundles dmg
          - name: Linux x86_64
            artifact_name: linux-x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundle_args: --bundles deb,rpm
          - name: Linux ARM64
            artifact_name: linux-aarch64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bundle_args: --bundles deb,rpm
            standalone_binary: nezha-linux-aarch64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build TUI client
        run: pnpm tui:build

      - name: Build TUI backend daemon
        run: cargo build --manifest-path src-tauri/Cargo.toml --bin nezha-backend --release --target ${{ matrix.target }}

      - name: Package TUI artifact
        shell: bash
        run: |
          set -euo pipefail
          pkg="nezha-tui-${{ matrix.target }}"
          mkdir -p "$pkg/dist-tui"
          cp -R dist-tui/* "$pkg/dist-tui/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "src-tauri/target/${{ matrix.target }}/release/nezha-backend.exe" "$pkg/nezha-backend.exe"
            printf '@echo off\r\nset SCRIPT_DIR=%%~dp0\r\nset NEZHA_BACKEND=%%SCRIPT_DIR%%nezha-backend.exe\r\nnode "%%SCRIPT_DIR%%dist-tui\\src-tui\\main.js" %%*\r\n' > "$pkg/nezha-tui.cmd"
            7z a "$pkg.zip" "$pkg"
          else
            cp "src-tauri/target/${{ matrix.target }}/release/nezha-backend" "$pkg/nezha-backend"
            cat > "$pkg/nezha-tui" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export NEZHA_BACKEND="$DIR/nezha-backend"
          exec node "$DIR/dist-tui/src-tui/main.js" "$@"
          EOF
            chmod +x "$pkg/nezha-tui" "$pkg/nezha-backend"
            tar -czf "$pkg.tar.gz" "$pkg"
          fi

      - name: Build ${{ matrix.name }}
        run: pnpm tauri build --target ${{ matrix.target }} ${{ matrix.bundle_args }}

      - name: Copy standalone executable
        if: matrix.standalone_binary
        shell: bash
        run: cp "src-tauri/target/${{ matrix.target }}/release/nezha" "${{ matrix.standalone_binary }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            ${{ matrix.standalone_binary }}
            nezha-tui-${{ matrix.target }}.tar.gz
            nezha-tui-${{ matrix.target }}.zip

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-artifacts/**/*
          token: ${{ secrets.GITHUB_TOKEN }}
